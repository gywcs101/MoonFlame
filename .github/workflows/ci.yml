name: CI

# 覆盖检查、构建、测试、格式化与接口一致性。
# 依据 moonbit-community 官方 check.yml 模板编写，并在此基础上：
#   - 加了 --deny-warn（警告即失败），比模板更严格；
#   - 多了一个端到端出图的 job，验证渲染器真的能跑。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root:
    name: 根模块 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 MoonBit 工具链（macOS / Linux）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 安装 MoonBit 工具链（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # `moon update` 是必需的：全新环境里包注册表索引是空的，
      # 不更新的话下一步会报 `moonbitlang/x` module was not found in the registry。
      - name: 安装后置：更新注册表索引
        run: |
          moon version --all
          moon update

      # 项目硬依赖 moonc >= 0.10.14：旧版本会因 implicit_impl_as_method 报错而无法编译。
      # moon.mod 不支持声明该要求（实测 `moonc` / `compiler` 字段都会被拒），
      # 所以在这里显式校验，把隐性要求变成 CI 上的显式失败。
      - name: 校验工具链版本
        shell: bash
        run: |
          need="0.10.14"
          ver=$(moon version --all | sed -n 's/^moonc v\([0-9][0-9.]*\).*/\1/p' | head -n1)
          if [ -z "$ver" ]; then
            echo "::error::无法从 'moon version --all' 解析出 moonc 版本"
            moon version --all
            exit 1
          fi

          # 逐段比较。判断「更大」只用字符串运算：数字位数多则更大，位数相同则按字典序。
          # 刻意不做算术求值——bash 会把 08 之类的前导零当八进制，白白引入坑。
          ge() { [ "${#1}" -gt "${#2}" ] && return 0
                 [ "${#1}" -lt "${#2}" ] && return 1
                 [ "$1" \> "$2" ] || [ "$1" = "$2" ]; }

          IFS=. read -r va vb vc <<< "$ver"
          IFS=. read -r na nb nc <<< "$need"
          fail=0
          for pair in "${va:-0}:${na:-0}" "${vb:-0}:${nb:-0}" "${vc:-0}:${nc:-0}"; do
            a="${pair%%:*}"; b="${pair##*:}"
            [ "$a" = "$b" ] && continue
            ge "$a" "$b" || fail=1
            break
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::moonc $ver 低于本项目要求的 $need（旧版会因 implicit_impl_as_method 无法编译）"
            exit 1
          fi
          echo "moonc $ver 满足要求（>= $need）"

      # --deny-warn：警告即失败。这条比官方模板严格，是工程质量的正向信号。
      - name: 类型检查（全部后端，警告即失败）
        run: moon check --target all --deny-warn

      - name: 构建（全部后端，警告即失败）
        run: moon build --target all --deny-warn

      - name: 测试（全部后端，警告即失败）
        run: moon test --target all --deny-warn

      - name: 格式检查
        run: moon fmt --check

      # 只在 Linux 上比对接口，避免不同平台的换行符造成假失败
      - name: 接口是否已更新
        if: runner.os == 'Linux'
        shell: bash
        run: |
          moon info
          if ! git diff --quiet -- '*.mbti'; then
            echo "::error::pkg.generated.mbti 与源码不一致。请在本地运行 'moon info' 并提交。"
            git diff -- '*.mbti'
            exit 1
          fi

  demo:
    name: 演示负载模块 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: demo

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 MoonBit 工具链（macOS / Linux）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 安装 MoonBit 工具链（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: 安装后置：更新注册表索引
        run: |
          moon version --all
          moon update

      # demo 是独立模块，根模块的检查覆盖不到它
      - name: 类型检查
        run: moon check --deny-warn

      - name: 测试
        run: moon test --deny-warn

  # 渲染器本身必须能跑：用仓库自带的样例数据出一张图，并校验产物非空。
  render:
    name: 端到端出图
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 MoonBit 工具链
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 安装后置：更新注册表索引
        run: |
          moon version --all
          moon update

      - name: 用自带样例数据出图
        shell: bash
        run: |
          moon run cmd/main -- testdata/demo.folded --out flame.svg
          test -s flame.svg || { echo "::error::未生成 SVG"; exit 1; }
          grep -q '<g id="frames">' flame.svg || { echo "::error::SVG 结构异常"; exit 1; }

      - name: 差异模式出图
        shell: bash
        run: |
          moon run cmd/main -- diff testdata/demo-baseline.folded testdata/demo.folded -o flame-diff.svg
          test -s flame-diff.svg || { echo "::error::未生成差异 SVG"; exit 1; }

      # 文本报告子命令也逐条跑一遍。
      # README 里承诺的每条用法都必须在 CI 上真跑通 —— 否则一旦参数位置变了
      # （例如把 --top 从顶层移进 hotspots），只会静默打印用法而无人察觉。
      - name: 文本报告子命令
        shell: bash
        run: |
          moon run cmd/main -- hotspots testdata/demo.folded --top 5
          moon run cmd/main -- callers  testdata/demo.folded walk_tree
          moon run cmd/main -- callees  testdata/demo.folded build_strings
          moon run cmd/main -- delta    testdata/demo-baseline.folded testdata/demo.folded --top 5

      # filter 的输出是折叠栈文本，必须能再喂回渲染器
      - name: 过滤后仍可出图
        shell: bash
        run: |
          moon run cmd/main -- filter build_strings testdata/demo.folded -o sub.folded
          test -s sub.folded || { echo "::error::未生成过滤结果"; exit 1; }
          moon run cmd/main -- sub.folded --out sub.svg
          test -s sub.svg || { echo "::error::过滤结果无法出图"; exit 1; }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: flame-graphs
          path: |
            flame.svg
            flame-diff.svg
            sub.svg
          retention-days: 7
